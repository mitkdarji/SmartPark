# Reverse proxy: static frontend from the API image, everything else upstream.
upstream smartpark_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WebSockets need the upgrade headers passed through verbatim.
    location /ws/ {
        proxy_pass http://smartpark_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(api|health|docs|redoc|openapi.json|media)/? {
        proxy_pass http://smartpark_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The SPA: hashed assets cache forever, index.html never does.
    location / {
        proxy_pass http://smartpark_api;
        proxy_set_header Host $host;
    }
}
